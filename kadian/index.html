<h1>卡点 · 帮助与支持</h1>
<p>毫秒对时，抢票卡点不慌</p>
<h2>常见问题</h2>
<p><b>数据保存在哪里？</b><br>全部保存在你的手机上，我们没有服务器。可以在 App 里导出备份。</p>
<p><b>要付费吗？</b><br>全部功能免费，没有广告。</p>
<p><b>为什么和抢购页面上的倒计时不一样？</b><br>抢购页面的倒计时是手机自己算的，可能差 1 秒左右。卡点对齐平台的服务器时间，选对平台后看卡点的时间就行。对不上时界面会写明，这时显示的是手机时间。</p>
<p><b>会替我抢吗？</b><br>不会。卡点只帮你看准时间，下单要你自己点。</p>
<h2>联系我们</h2>
<p>在 App 里点「意见反馈」，我们会尽快回复。</p>
