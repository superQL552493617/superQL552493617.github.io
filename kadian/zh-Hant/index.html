<h1>卡點 · 幫助與支持</h1>
<p>毫秒對時，搶票卡點不慌</p>
<h2>常見問題</h2>
<p><b>資料儲存在哪裡？</b><br>全部儲存在你的手機上，我們沒有伺服器。可以在 App 裡匯出備份。</p>
<p><b>要付費嗎？</b><br>全部功能免費，沒有廣告。</p>
<p><b>為什麼和搶購頁面上的倒計時不一樣？</b><br>搶購頁面的倒計時是手機自己算的，可能差 1 秒左右。卡點對齊平臺的伺服器時間，選對平臺後看卡點的時間就行。對不上時介面會寫明，這時顯示的是手機時間。</p>
<p><b>會替我搶嗎？</b><br>不會。卡點只幫你看準時間，下單要你自己點。</p>
<h2>聯絡我們</h2>
<p>在 App 裡點「意見反饋」，我們會盡快回復。</p>
